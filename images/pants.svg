<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F4F0"/>
      <stop offset="100%" stop-color="#E8E6E1"/>
    </linearGradient>
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B3A4A"/>
      <stop offset="100%" stop-color="#1A2430"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad)"/>
  <!-- Trousers/Pants Illustration -->
  <g transform="translate(170, 100)">
    <!-- Waistband -->
    <rect x="20" y="20" width="220" height="40" rx="4" fill="#1A2430"/>
    <rect x="110" y="30" width="40" height="20" rx="2" fill="#C8A96E"/>
    <!-- Belt loops -->
    <rect x="40" y="15" width="12" height="50" fill="#3A4D60"/>
    <rect x="90" y="15" width="12" height="50" fill="#3A4D60"/>
    <rect x="160" y="15" width="12" height="50" fill="#3A4D60"/>
    <rect x="210" y="15" width="12" height="50" fill="#3A4D60"/>
    <!-- Left Leg -->
    <path d="M 20 60 L 120 60 L 105 580 L 15 580 Z" fill="url(#pantsGrad)"/>
    <!-- Right Leg -->
    <path d="M 140 60 L 240 60 L 245 580 L 155 580 Z" fill="url(#pantsGrad)"/>
    <!-- Center seam & pocket detailing -->
    <path d="M 130 60 L 130 200" stroke="#101720" stroke-width="3"/>
    <path d="M 30 75 Q 80 85 95 140" fill="none" stroke="#3A4D60" stroke-width="3"/>
    <path d="M 230 75 Q 180 85 165 140" fill="none" stroke="#3A4D60" stroke-width="3"/>
    <!-- Cuffs -->
    <rect x="15" y="560" width="90" height="20" fill="#101720"/>
    <rect x="155" y="560" width="90" height="20" fill="#101720"/>
  </g>
</svg>
