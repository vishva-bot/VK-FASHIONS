<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#EFECE6"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A607A"/>
      <stop offset="100%" stop-color="#2C3E55"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bgGrad)"/>
  <!-- Dress Shirt Illustration -->
  <g transform="translate(130, 80)">
    <!-- Collar Left & Right -->
    <path d="M 120 40 L 170 120 L 140 130 L 100 60 Z" fill="#FFFFFF"/>
    <path d="M 220 40 L 170 120 L 200 130 L 240 60 Z" fill="#E8E8E8"/>
    <!-- Collar Tie/Band -->
    <path d="M 100 60 C 130 90 210 90 240 60 L 220 40 C 180 60 160 60 120 40 Z" fill="#1A1A1A"/>
    <!-- Main Body -->
    <path d="M 70 90 L 120 40 L 220 40 L 270 90 L 310 240 L 280 250 L 260 170 L 260 550 L 80 550 L 80 170 L 60 250 L 30 240 Z" fill="url(#shirtGrad)"/>
    <!-- Front Placket & Buttons -->
    <rect x="160" y="70" width="20" height="480" fill="#243346"/>
    <circle cx="170" cy="140" r="5" fill="#FFFFFF"/>
    <circle cx="170" cy="220" r="5" fill="#FFFFFF"/>
    <circle cx="170" cy="300" r="5" fill="#FFFFFF"/>
    <circle cx="170" cy="380" r="5" fill="#FFFFFF"/>
    <circle cx="170" cy="460" r="5" fill="#FFFFFF"/>
    <!-- Chest Pocket -->
    <path d="M 95 190 L 140 190 L 140 250 L 117 265 L 95 250 Z" fill="#364961" stroke="#243346" stroke-width="2"/>
  </g>
</svg>
